name: rideshare_showcase
description: "RideShare connected Android and browser app, built with Flutter and Dart."
publish_to: none
version: 1.2.0+3
environment:
  sdk: ^3.13.5
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  crypto: ^3.0.7
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.3
  geolocator: ^14.1.1
  file_picker: ^13.1.0
  pdf: ^3.13.1
  printing: ^5.15.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/emergency.json
    - assets/maps/dhaka-roads.json
    - assets/maps/LICENSE.txt
  fonts:
    - family: RideBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
    - family: RideRoboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
