services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rideshare}
      MYSQL_USER: ${MYSQL_USER:-rideshare_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-this-local-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-this-root-password}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - rideshare_mysql:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-change-this-root-password}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_SECRET: ${APP_SECRET:-replace-with-a-long-random-secret}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-rideshare}
      DB_USER: ${MYSQL_USER:-rideshare_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:-change-this-local-password}
      MAP_ROUTE_URL: ${MAP_ROUTE_URL:-}
      MAP_TILE_URL: ${MAP_TILE_URL:-/map-tiles/{z}/{x}/{y}.png}
    ports:
      - "127.0.0.1:8080:80"

  phpmyadmin:
    image: phpmyadmin:5-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 32M
    ports:
      - "127.0.0.1:8081:80"

volumes:
  rideshare_mysql:
