graphhopper:
  datareader.file: R:/.local/routing/dhaka.osm.pbf
  graph.location: R:/.local/routing/graph
  profiles:
    - name: car
      turn_costs:
        vehicle_types: [motorcar, motor_vehicle]
        u_turn_costs: 60
      custom_model_files: [car.json]
    - name: motorcycle
      turn_costs:
        vehicle_types: [motorcycle, motor_vehicle]
        u_turn_costs: 60
      custom_model_files: [motorcycle.json]
  profiles_ch:
    - profile: car
    - profile: motorcycle
  profiles_lm: []
  graph.encoded_values: car_access, car_average_speed, road_access, road_class, track_type, surface
  import.osm.ignored_highways: footway, construction, cycleway, path, steps
  graph.dataaccess.default_type: RAM_STORE
  graph.elevation.provider: noop
server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: 127.0.0.1
  admin_connectors:
    - type: http
      port: 8990
      bind_host: 127.0.0.1
  request_log:
    appenders: []
logging:
  level: INFO
  appenders:
    - type: console
